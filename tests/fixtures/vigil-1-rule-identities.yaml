            - id: cs-vigil1-93
              text: Apply the same permission requirements to scheduled, direct, and recovery commands.
            - id: cs-vigil1-94
              text: Reassess permission during the activity as new information arrives and existing information ages. If permission is lost, command a restriction or stop and report the reason to mission operations.
            - id: cs-vigil1-95
