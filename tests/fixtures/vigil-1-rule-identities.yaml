        - from: 4661
          to: 4808
          id: cs-vigil1-87
          key: cs-vigil1-86:["Update the process model from received requests and feedback. Keep the requested activity, commanded action, and reported execution state distinct.",1]
          kind: rule
        - from: 4811
          to: 4910
          id: cs-vigil1-88
          key: cs-vigil1-86:["Preserve source measurement times. Receiving or rechecking an old measurement does not make it new.",1]
          kind: rule
        - from: 4913
          to: 5058
          id: cs-vigil1-89
          key: cs-vigil1-86:["Check the validity and age of required health information. Missing, invalid, or more-than-two-second-old information cannot establish permission.",1]
          kind: rule
        - from: 5061
          to: 5265
          id: cs-vigil1-90
          key: cs-vigil1-86:["Assess capability for the requested maneuver and required acquisition attitude using the reported capability and activity parameters. A passing LC condition check alone does not establish that capability.",1]
          kind: rule
        - from: 5268
          to: 5556
          id: cs-vigil1-91
          key: cs-vigil1-86:["Assess whether the planned acquisition can remain within power and thermal limits using reported state, activity mode, duration, expected resource demand, and applicable limits. The demand estimates and prediction method are unresolved; keep this assessment unknown until it is supported.",1]
          kind: rule
        - from: 5559
          to: 5860
          id: cs-vigil1-92
          key: cs-vigil1-86:["Issue a permitted-maneuver or start-acquisition command only when the applicable permission requirements are established. Do not authorize the requested activity when required capability, information, or feasibility remains unknown. Report the restriction or missing information to mission operations.",1]
          kind: rule
        - from: 5863
          to: 5946
          id: cs-vigil1-93
          key: cs-vigil1-86:["Apply the same permission requirements to scheduled, direct, and recovery commands.",1]
          kind: rule
        - from: 5949
          to: 6144
          id: cs-vigil1-94
          key: cs-vigil1-86:["Reassess permission during the activity as new information arrives and existing information ages. If permission is lost, command a restriction or stop and report the reason to mission operations.",1]
          kind: rule
        - from: 6147
          to: 6394
          id: cs-vigil1-95
          key: cs-vigil1-86:["Use feedback to confirm execution and the effects of restriction or stop commands. Command acceptance alone does not establish that an activity started, stopped, or completed. Report unknown execution state when the feedback does not establish it.",1]
          kind: rule
