metadata:
  authoring:
    version: m45.control-structure-authoring.v1
    grammarVersion: "0.1"
    source: |
      # Scope: These process boxes represent activities; internal payload and ground-station controllers are not shown.

      # Mission coordination
      Imagery user (controller) -> Mission operations (controller): Target, deadline, and image acceptance criteria
      Mission operations -> Imagery user: Request disposition and predicted delivery [feedback]

      # Onboard control
      Mission operations -> Onboard activity control (controller): Acquisition plan and operating limits
      Onboard activity control -> Mission operations: Plan acceptance, actual execution state, and restriction reasons [feedback]
      Mission operations -> "Stored Command (SC)" (controller): Stored command sequences and timing
      "Stored Command (SC)" -> Onboard activity control: Scheduled and protective commands
      "Limit Checker (LC)" (controller) -> "Stored Command (SC)": Protective sequence request
      # LC reports configured condition checks; onboard activity control decides permission.
      "Limit Checker (LC)" -> Onboard activity control: Condition-check results, source measurement time, and validity [feedback]
      Onboard activity control -> "Limit Checker (LC)": Data receipt and validity faults [feedback]
      Onboard activity control -> Attitude control (controller): Permitted maneuver and required attitude
      Attitude control -> Onboard activity control: Attitude, wheel state, and capability [feedback]
      # Telemetry-source assumption: Attitude control includes its wheel-device interface.
      # The detailed publisher and transport are not established by the supplied artifacts.
      Attitude control -> "Limit Checker (LC)": Attitude and wheel telemetry, measurement time, and validity [feedback]
      # Chosen functional allocation: measurements are supplied by the Flight Computer reporting function.
      # Detailed publishers, transport, measurement coverage, and validity handling remain unverified.
      Spacecraft health and status reporting (sensor) -> "Limit Checker (LC)": Power and thermal measurements, source measurement times, and validity [feedback]
      Spacecraft health and status reporting -> Onboard activity control: Power and thermal state, source measurement times, and validity [feedback]
      Onboard activity control -> "SAR data acquisition (SAR payload)" (process): Start acquisition
      Onboard activity control -> "SAR data acquisition (SAR payload)": Restrict or stop acquisition
      "SAR data acquisition (SAR payload)" -> Onboard activity control: Actual acquisition state, progress, completion, or interruption [feedback]

      # Ground delivery
      Mission operations -> "Downlink reception and data transfer (ground station)" (process): Reserved contact and expected data volume
      "Downlink reception and data transfer (ground station)" -> Mission operations: Contact availability and reception status [feedback]
      Mission operations -> Dedicated ground product processing (controller): Processing priority, capacity allocation, and acceptance criteria
      "SAR data acquisition (SAR payload)" -> "Downlink reception and data transfer (ground station)": Acquisition data and context [information]
      "Downlink reception and data transfer (ground station)" -> Dedicated ground product processing: Received data and completeness status [information]
      Dedicated ground product processing -> "Downlink reception and data transfer (ground station)": Data receipt and processing readiness [information]
      Dedicated ground product processing -> Mission operations: Processing readiness, progress, predicted completion, and acceptance results [feedback]
      Dedicated ground product processing -> Imagery user: Product, quality limitations, and delivery status [information]
      Imagery user -> Dedicated ground product processing: Receipt and usability assessment [feedback]

      # Onboard activity control internals
      # Functional design derived from V1-PROTECTION; not a verified implementation model.
      # Power and thermal prediction inputs and method remain unresolved.
      Onboard activity control process model:
        Requested maneuver or acquisition, including its parameters, required attitude, and planned duration
        Applicable attitude, power, and thermal limits
        Latest reported attitude, wheel state, and capability for the requested activity
        Latest configured condition-check results from LC
        Source measurement times and validity of the information used in the permission decision
        Latest reported power and thermal state
        Assessed ability to remain within power and thermal limits throughout acquisition: supported, unsupported, or unknown
        Last commanded action and whether its effect has been confirmed by feedback
        Reported maneuver and acquisition execution state, including when that state is unknown

      Onboard activity control control algorithm:
        Update the process model from received requests and feedback. Keep the requested activity, commanded action, and reported execution state distinct.
        Preserve source measurement times. Receiving or rechecking an old measurement does not make it new.
        Check the validity and age of required health information. Missing, invalid, or more-than-two-second-old information cannot establish permission.
        Assess capability for the requested maneuver and required acquisition attitude using the reported capability and activity parameters. A passing LC condition check alone does not establish that capability.
        Assess whether the planned acquisition can remain within power and thermal limits using reported state, activity mode, duration, expected resource demand, and applicable limits. The demand estimates and prediction method are unresolved; keep this assessment unknown until it is supported.
        Issue a permitted-maneuver or start-acquisition command only when the applicable permission requirements are established. Do not authorize the requested activity when required capability, information, or feasibility remains unknown. Report the restriction or missing information to mission operations.
        Apply the same permission requirements to scheduled, direct, and recovery commands.
        Reassess permission during the activity as new information arrives and existing information ages. If permission is lost, command a restriction or stop and report the reason to mission operations.
        Use feedback to confirm execution and the effects of restriction or stop commands. Command acceptance alone does not establish that an activity started, stopped, or completed. Report unknown execution state when the feedback does not establish it.
