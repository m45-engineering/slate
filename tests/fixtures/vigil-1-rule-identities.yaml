  - id: cs-vigil1-3
    label: Onboard activity control
    kind: controller
    annotations:
      authoringUnclassified: false
      authoringDetails:
        version: 1
        processModel:
          id: cs-vigil1-76
          variables:
            - id: cs-vigil1-77
              text: Requested maneuver or acquisition, including its parameters, required attitude, and planned duration
            - id: cs-vigil1-78
              text: Applicable attitude, power, and thermal limits
            - id: cs-vigil1-79
              text: Latest reported attitude, wheel state, and capability for the requested activity
            - id: cs-vigil1-80
              text: Latest configured condition-check results from LC
            - id: cs-vigil1-81
              text: Source measurement times and validity of the information used in the permission decision
            - id: cs-vigil1-82
              text: Latest reported power and thermal state
            - id: cs-vigil1-83
              text: "Assessed ability to remain within power and thermal limits throughout acquisition: supported, unsupported, or unknown"
            - id: cs-vigil1-84
              text: Last commanded action and whether its effect has been confirmed by feedback
            - id: cs-vigil1-85
              text: Reported maneuver and acquisition execution state, including when that state is unknown
        controlAlgorithm:
          id: cs-vigil1-86
          text: |-
            Update the process model from received requests and feedback. Keep the requested activity, commanded action, and reported execution state distinct.
            Preserve source measurement times. Receiving or rechecking an old measurement does not make it new.
            Check the validity and age of required health information. Missing, invalid, or more-than-two-second-old information cannot establish permission.
            Assess capability for the requested maneuver and required acquisition attitude using the reported capability and activity parameters. A passing LC condition check alone does not establish that capability.
            Assess whether the planned acquisition can remain within power and thermal limits using reported state, activity mode, duration, expected resource demand, and applicable limits. The demand estimates and prediction method are unresolved; keep this assessment unknown until it is supported.
            Issue a permitted-maneuver or start-acquisition command only when the applicable permission requirements are established. Do not authorize the requested activity when required capability, information, or feasibility remains unknown. Report the restriction or missing information to mission operations.
            Apply the same permission requirements to scheduled, direct, and recovery commands.
            Reassess permission during the activity as new information arrives and existing information ages. If permission is lost, command a restriction or stop and report the reason to mission operations.
            Use feedback to confirm execution and the effects of restriction or stop commands. Command acceptance alone does not establish that an activity started, stopped, or completed. Report unknown execution state when the feedback does not establish it.
