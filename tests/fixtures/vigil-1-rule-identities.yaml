title: Vigil-1 — acquisition and delivery control structure
description: "Control responsibilities for Vigil-1 SAR acquisition and delivery. Source records: V1-PROTECTION revision 10 (03-protection-model.md) and V1-ALLOCATION revision 7 (05-design-allocation.md)."
