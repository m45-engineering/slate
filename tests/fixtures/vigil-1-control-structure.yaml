    grammarVersion: "0.1"
    source: |
      # Mission coordination
      Imagery user (controller) -> Mission operations (controller): Target, deadline, and image acceptance criteria
      Mission operations -> Imagery user: Request disposition and predicted delivery [feedback]

      # Onboard control
      Mission operations -> Onboard activity control (controller): Acquisition plan and operating limits
      Mission operations -> SC (controller): Stored command sequences and timing
      SC -> Onboard activity control: Scheduled and protective commands
      Health assessment (controller) -> SC: Protective sequence request
      Health assessment -> Onboard activity control: Equipment capability, measurement time, and validity [feedback]
      Onboard activity control -> Health assessment: Data receipt and validity faults [feedback]
      Onboard activity control -> Attitude control (controller): Permitted maneuver and required attitude
      Attitude control -> Onboard activity control: Attitude, wheel state, and capability [feedback]
      Onboard activity control -> SAR payload (process): Permitted acquisition or restriction
      SAR payload -> Onboard activity control: Acquisition progress, completion, or interruption [feedback]

      # Ground delivery
      Mission operations -> Dedicated ground station (process): Reserved contact and expected data volume
      Dedicated ground station -> Mission operations: Contact availability and reception status [feedback]
      Mission operations -> Dedicated ground product processing (controller): Processing priority, capacity allocation, and acceptance criteria
      SAR payload -> Dedicated ground station: Acquisition data and context [information]
      Dedicated ground station -> Dedicated ground product processing: Received data and completeness status [information]
      Dedicated ground product processing -> Dedicated ground station: Data receipt and processing readiness [information]
      Dedicated ground product processing -> Mission operations: Processing readiness, progress, predicted completion, and acceptance results [feedback]
      Dedicated ground product processing -> Imagery user: Product, quality limitations, and delivery status [information]
      Imagery user -> Dedicated ground product processing: Product acceptance [feedback]

      # Permission decision
      Onboard activity control process model:
        Current acquisition plan and operating limits
        Health measurement time and validity
        Capability for the requested maneuver and acquisition
        Current attitude, power, and thermal state

      Onboard activity control control algorithm:
        Apply CON-01 before each maneuver and SAR acquisition, including scheduled, direct, and recovery commands.
        Require valid health information no more than two seconds old, the required attitude capability, and compliance with power and thermal limits.
        Monitor applicable limits during the activity. Restrict the activity if permission is lost and report the reason to mission operations.
