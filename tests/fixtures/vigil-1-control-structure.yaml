    kind: controller
    annotations:
      authoringDetails:
        version: 1
        processModel:
          id: cs-vigil1-52
          variables:
            - id: cs-vigil1-53
              text: Current acquisition plan and operating limits
            - id: cs-vigil1-54
              text: Health measurement time and validity
            - id: cs-vigil1-55
              text: Capability for the requested maneuver and acquisition
            - id: cs-vigil1-56
              text: Current attitude, power, and thermal state
        controlAlgorithm:
          id: cs-vigil1-57
          text: |-
            Apply CON-01 before each maneuver and SAR acquisition, including scheduled, direct, and recovery commands.
            Require valid health information no more than two seconds old, the required attitude capability, and compliance with power and thermal limits.
            Monitor applicable limits during the activity. Restrict the activity if permission is lost and report the reason to mission operations.
