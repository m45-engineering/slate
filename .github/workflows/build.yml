name: Build Slate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for application changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          build=true
          reason='Documentation-only change'
          # Manual runs and unavailable base commits always take the full build path.
          if [[ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' && -n "$BASE_SHA" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            if git diff --quiet "$BASE_SHA" HEAD -- . ':!README.md' ':!CHANGELOG.md' ':!docs/**'; then
              build=false
            else
              status=$?
              if [[ "$status" -ne 1 ]]; then exit "$status"; fi
              # One-time transition from the exact workflow that predates docs-only skipping.
              # Other application/configuration files must still be unchanged.
              previous_workflow=$(git rev-parse "$BASE_SHA:.github/workflows/build.yml" 2>/dev/null || true)
              if [[ "$previous_workflow" == '408858a9f52fef0cf9737ec6fc29e0107e87fa51' ]] && git diff --quiet "$BASE_SHA" HEAD -- . ':!README.md' ':!CHANGELOG.md' ':!docs/**' ':!.github/workflows/build.yml'; then
                build=false
                reason='Documentation and initial docs-only workflow update'
              fi
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if [[ "$build" == false ]]; then
            echo "$reason. Skipping desktop validation and packaging regardless of cache availability." >> "$GITHUB_STEP_SUMMARY"
          fi
  desktop:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.build == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Fingerprint files that affect validation and installers
        id: source
        shell: bash
        run: |
          fingerprint=$(git ls-files --stage -z -- . ':!README.md' ':!CHANGELOG.md' ':!docs/**' | git hash-object --stdin)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      # Reuse only a completed successful run for the exact same source tree and platform.
      # Include the workflow and test fixtures; exclude release documents and docs/.
      - uses: actions/cache/restore@v5
        id: validated
        with:
          path: ${{ runner.temp }}/slate-validation
          key: slate-validated-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.source.outputs.fingerprint }}
          lookup-only: true
      - name: Reuse successful validation
        if: steps.validated.outputs.cache-hit == 'true' && github.event_name != 'workflow_dispatch'
        shell: bash
        run: echo 'Unchanged application, tests, and build configuration already passed on this platform. Skipping tests and packaging. Run this workflow manually to build fresh installers.' >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v5
        if: steps.validated.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
      - uses: actions/setup-node@v6
        if: steps.validated.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.validated.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
      - run: pnpm check
        if: steps.validated.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
      - run: pnpm icons
        if: steps.validated.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
      - run: pnpm build
        if: steps.validated.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
      - run: pnpm test:e2e
        if: steps.validated.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
      - name: Upload test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: slate-test-failures-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
      - name: Package installers
        if: steps.validated.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm exec electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v6
        if: steps.validated.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        with:
          name: slate-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
      - name: Record successful validation
        if: steps.validated.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/slate-validation"
          printf 'passed\n' > "$RUNNER_TEMP/slate-validation/passed"
      - uses: actions/cache/save@v5
        if: steps.validated.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/slate-validation
          key: ${{ steps.validated.outputs.cache-primary-key }}
